name: Build on Windows

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors[0].Message)"
            } else {
              Write-Host "OK: $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Build RescueDrive.exe (Windows-native)
        shell: pwsh
        env:
          # Optional code signing. Add these as repository secrets to get a
          # signed exe that SmartScreen/AV won't block. If unset, the build
          # produces a working unsigned exe (see installer-exe/Sign-Exe.ps1).
          RESCUE_SIGN_PFX_BASE64: ${{ secrets.RESCUE_SIGN_PFX_BASE64 }}
          RESCUE_SIGN_PFX_PASSWORD: ${{ secrets.RESCUE_SIGN_PFX_PASSWORD }}
        run: ./installer-exe/Build-Exe.ps1

      - name: Smoke-test the exe payload
        shell: pwsh
        run: |
          $exe = 'dist/RescueDrive.exe'
          if (-not (Test-Path $exe)) { throw 'exe not produced' }
          $asm = [System.Reflection.Assembly]::LoadFrom((Resolve-Path $exe))
          if ($asm.GetManifestResourceNames() -notcontains 'RescueDrive.payload.zip') {
            throw 'payload.zip not embedded'
          }
          Write-Host "exe OK: $((Get-Item $exe).Length) bytes, payload embedded."

      - name: Upload Windows-built installer
        uses: actions/upload-artifact@v4
        with:
          name: RescueDrive-installer
          path: dist/RescueDrive.exe

      - name: Commit Windows-built exe back to the branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/RescueDrive.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Update dist/RescueDrive.exe with Windows-native build [skip ci]'
            git push
          } else {
            Write-Host 'dist exe already up to date.'
          }
